# lazygit config
# Docs: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  # Use Nerd Font icons
  nerdFontsVersion: "3"
  # Rounded borders
  border: rounded
  # Catppuccin Latte theme
  theme:
    activeBorderColor:
      - "#8839ef" # Mauve
      - bold
    inactiveBorderColor:
      - "#acb0be" # Surface1
    optionsTextColor:
      - "#1e66f5" # Blue
    selectedLineBgColor:
      - "#ccd0da" # Surface0
    selectedRangeBgColor:
      - "#ccd0da" # Surface0
    cherryPickedCommitBgColor:
      - "#acb0be" # Surface1
    cherryPickedCommitFgColor:
      - "#8839ef" # Mauve
    unstagedChangesColor:
      - "#d20f39" # Red
    defaultFgColor:
      - "#4c4f69" # Text
    searchingActiveBorderColor:
      - "#df8e1d" # Yellow
git:
  # Do not fetch all remotes on startup
  autoFetch: false
os:
  # Open files in Neovim
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"
  editAtLineAndWait: "nvim +{{line}} {{filename}}"
  openDirInEditor: "nvim {{dir}}"
  # Suspend lazygit while the editor is open, then resume
  suspend: true
customCommands:
  - key: "<c-u>"
    context: "global"
    prompts:
      - type: "input"
        title: "Rebase onto upstream branch:"
        key: "Branch"
        initialValue: "develop"
    command: "git pull --rebase upstream {{.Form.Branch}}"
    output: log
  # Paste "user:branch" from a GitHub PR page; fetches it if not local.
  - key: "C"
    context: "localBranches"
    description: "Checkout PR branch (user:branch)"
    prompts:
      - type: "input"
        title: "PR branch (user:branch)"
        key: "Ref"
    command: "ghco {{.Form.Ref | quote}}"
    loadingText: "Fetching branch..."
